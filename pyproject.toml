[project]
name = "nova-synthetic-market-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
nova-lab = "nova_lab.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
